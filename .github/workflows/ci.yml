name: CI

on:
  push:
    # Chunk branches run the same two legs a master push does, so a chunk's CI answer arrives
    # before its diff is reviewed rather than after it lands. The macOS job below stays off this
    # path, gated to dispatch and schedule, so a branch push costs exactly what a master push costs.
    branches: [master, 'chunk/**']
    # CI only builds/tests the Java app (`mvn -f app/pom.xml test`), so run it only when the app or
    # this workflow itself changes. Docs, devlog, memory, plans, and PowerShell scripts skip CI - no
    # point burning the matrix on a docs-only commit. If a build-affecting file ever lands outside
    # app/, add its path here.
    paths:
      - 'app/**'
      - '.github/workflows/ci.yml'
  pull_request:
    paths:
      - 'app/**'
      - '.github/workflows/ci.yml'
  # The macOS job below runs on these two events only, never on a push. A macOS runner draws ten
  # times its wall-clock against the account's monthly minute allowance, and a private repo's
  # workflows stop running once that allowance is spent. So the cadence is chosen against the
  # allowance rather than against a bill. Weekly plus the manual trigger costs about a tenth of
  # it. Nightly would cost most of it, and the price of getting that wrong is CI stopping in the
  # middle of a phase.
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * 1'

jobs:
  build:
    strategy:
      # One leg's failure must not hide another's. Each answers a different question, so we need
      # every leg's log even when one of them goes red.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    # A green run takes about three minutes. The ceiling is here because a native credential-store
    # call can hang rather than fail, and GitHub's own default would let one hold a runner for six
    # hours. Generous against the real duration, so an ordinary slow run is never cut short.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '26'
          cache: maven

      # CliHeifDecoder (Phase 8) shells to a libheif-based CLI (heif-convert) to decode real
      # HEIC/HEIF/AVIF fixtures. The tests exercise the real binary instead of skipping in CI.
      # That way a regression is caught automatically, not just on a dev machine.
      # heif-convert is used rather than its newer heif-dec rename. Ubuntu's stock
      # libheif-examples package (both 22.04 and 24.04) only ships the older name. Pinning to it
      # avoids a cross-platform version mismatch instead of chasing a newer package source.
      - name: Install libheif CLI (Ubuntu)
        if: runner.os == 'Linux'
        # libheif-examples only pulls in libheif-plugin-aomdec (AV1, for AVIF) as a hard
        # dependency; the HEVC decoder plugin HEIC needs is merely suggested, so heif-convert
        # silently fails on real HEIC input unless it's installed explicitly too.
        #
        # The Chrome source comes with the runner image and this project installs nothing from it,
        # but apt-get update refreshes every source and fails the step on any one of them. That
        # repository has served an index whose hash disagrees with its own Release file, which
        # reddened this leg on a commit that touched no Linux code. Dropped rather than tolerating
        # a failed update, so a source we do need still fails loudly.
        run: |
          sudo rm -f /etc/apt/sources.list.d/google-chrome.list
          sudo apt-get update && sudo apt-get install -y libheif-examples libheif-plugin-libde265

      # The Linux keyring tests need a real Secret Service on a session bus, and a headless runner
      # has neither. Start both: a private D-Bus session, then gnome-keyring's secrets daemon
      # unlocked with a throwaway password. Both daemonize and outlive the step, and the bus
      # address is exported so the test step's JVM finds the service. The secret-tool round-trip
      # proves the service answers before Maven runs, so a broken daemon fails right here with its
      # own message instead of surfacing as an obscure Java test failure.
      - name: Start a Secret Service (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          # Its own update, rather than leaning on the libheif step above having run one. Both
          # steps are Linux-only today, so the ordering happens to work; nothing enforces it.
          sudo apt-get update
          sudo apt-get install -y gnome-keyring libsecret-1-0 libsecret-tools dbus-x11
          eval "$(dbus-launch --sh-syntax)"
          eval "$(printf 'sluice-ci\n' | gnome-keyring-daemon --unlock --replace --components=secrets)"
          echo "DBUS_SESSION_BUS_ADDRESS=$DBUS_SESSION_BUS_ADDRESS" >> "$GITHUB_ENV"
          printf 'smoke' | secret-tool store --label='Sluice CI smoke test' sluice-ci-smoke check
          test "$(secret-tool lookup sluice-ci-smoke check)" = 'smoke'
          secret-tool clear sluice-ci-smoke check

      - name: Install libheif CLI (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # windows-latest does not reliably ship 7-Zip (actions/runner-images#9361). Bootstrap a
          # standalone 7za.exe from NuGet first. A .nupkg is just a zip file, so Expand-Archive
          # handles it directly - no chicken-and-egg 7z-to-extract-7z problem.
          $temp = "$env:RUNNER_TEMP\libheif-install"
          New-Item -ItemType Directory -Force -Path $temp | Out-Null
          Invoke-WebRequest -Uri 'https://www.nuget.org/api/v2/package/7-Zip.CommandLine' -OutFile "$temp\7za.zip"
          Expand-Archive -Path "$temp\7za.zip" -DestinationPath "$temp\7za" -Force
          $sevenZa = (Get-ChildItem -Path "$temp\7za" -Recurse -Filter '7za.exe' | Select-Object -First 1).FullName
          if (-not $sevenZa) { throw "7za.exe not found inside the NuGet 7-Zip.CommandLine package - its internal layout may have changed." }

          # v1.14.0: an older build that still ships heif-convert.exe, matching both the command
          # name pinned above for Ubuntu and the local dev install.
          $archive = "$temp\libheif.7z"
          Invoke-WebRequest -Uri 'https://github.com/pphh77/libheif-Windowsbinary/releases/download/v1.14.0/libheif-1.14.0-win64.7z' -OutFile $archive
          $dest = "$env:RUNNER_TEMP\libheif"
          & $sevenZa x $archive "-o$dest" -y | Out-Null
          $binDir = (Get-ChildItem -Path $dest -Recurse -Filter 'heif-convert.exe' | Select-Object -First 1).DirectoryName
          if (-not $binDir) { throw "heif-convert.exe not found in the extracted libheif archive - its internal layout may have changed." }
          Add-Content -Path $env:GITHUB_PATH -Value $binDir

      - name: Build and test
        run: mvn -f app/pom.xml test

  # A separate job rather than a third entry in the matrix above, because it answers to different
  # events. A matrix cannot hold one leg back from a push while the other two run.
  build-macos:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: macos-latest
    # Same ceiling as the matrix above, and it matters more here: this runner bills at ten times
    # its wall-clock against the monthly allowance.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '26'
          cache: maven

      - name: Install libheif CLI (macOS)
        run: brew install libheif

      # This is the first time any of this code meets macOS, so report the environment before the
      # suite runs. Three things decide how the results are read. Which decoder name Homebrew
      # ships, since the other two runners are pinned to heif-convert. A rename here is a decoder
      # gap rather than a test bug. Whether the workspace volume is case-insensitive, which is
      # what would expose a file-move collision the other two runners cannot see. And the
      # architecture, since arm64 is what real users run.
      # It never fails the job. A missing tool should surface as the test that needs it going red,
      # with the reason already printed above it.
      - name: Report the environment
        continue-on-error: true
        run: |
          sw_vers
          uname -m
          echo "heif-convert: $(command -v heif-convert || echo 'absent')"
          echo "heif-dec:     $(command -v heif-dec || echo 'absent')"
          touch casing_A casing_a
          if [ "$(ls | grep -c '^casing_')" -eq 2 ]; then
            echo "workspace volume: case-SENSITIVE"
          else
            echo "workspace volume: case-INSENSITIVE"
          fi
          rm -f casing_A casing_a

      - name: Build and test
        run: mvn -f app/pom.xml test
