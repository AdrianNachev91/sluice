name: CLA Assistant

# Blocks a pull request until its author has signed CLA.md. The relicensing
# grant in CLA.md's Section 4 is why this check exists at all - see that file.
on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  CLAAssistant:
    runs-on: ubuntu-latest
    steps:
      - name: "CLA Assistant"
        if: (github.event.comment.body == 'recheck' || github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA') || github.event_name == 'pull_request_target'
        # Pinned to the last tag cut before the upstream repo was archived
        # (2026-03-23). Existing releases stay functional; there is no
        # actively maintained successor to move to as of this writing.
        uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-document: 'https://raw.githubusercontent.com/AdrianNachev91/sluice/master/CLA.md'
          path-to-signatures: 'signatures/version1/cla.json'
          branch: 'cla-signatures'
