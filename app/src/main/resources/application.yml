sluice:
  montage:
    tiles-per-row: 5
    tile-size: 224
  cull:
    # Which vision provider culls. Built in: external-agent (an agent you run reads the montages
    # and writes the decision shards) and anthropic (the app calls the Anthropic API with your
    # key). Future openai and ollama adapters are planned but not yet written. A new provider is
    # one class; see adapter/vision/package-info.java.
    provider: external-agent
    # Tuning for the external-agent provider only. mode: manual (default) needs an explicit
    # Resume once shards are dropped; watch also polls the prep dir and auto-resumes once every
    # shard is present and valid. watch-timeout (a duration, e.g. 30m) is unset by default,
    # meaning a watch never gives up on its own; when set, it only drops back to manual waiting
    # after that long with no fully-valid shard set - it never fails the job.
    external-agent:
      mode: manual
    # Category cards. name is the action id decisions carry. description is the "what belongs
    # here" prose an automated vision provider renders into its culling prompt.
    categories:
      - name: junk
        description: >-
          Objectively worthless photos. Blurry, out of focus, or motion-smeared. Accidental
          shots: pocket, floor, or ceiling shots, a finger over the lens, framing of nothing.
          Badly exposed: essentially all-black or all-white. Screenshots and UI captures,
          unless funny. Photos OF a screen: a phone photo of a monitor, laptop, TV, or
          projector showing code, a webpage, an app or game UI, a chat, or stats. These look
          dim, low-contrast, and angled, with glare and a visible bezel. At tile resolution
          they read as a dull grey rectangle with rows of small text or UI chrome. This is
          the single most-missed junk class. When a faint tile looks like that, it is almost
          always a photo of a screen. Documents and utility shots: receipts, whiteboards,
          paperwork, price tags, parking-spot reminders, delivery cards, letters, bills,
          forms, product and packaging shots. Received images and memes that are clearly not
          the owner's own photos.
      - name: scenery
        description: >-
          Unremarkable scenery set aside for a second look, only when ALL of these hold: no
          posing people (random passers-by do not count), not a recognizable landmark, no
          striking light or sky, weak composition. Any doubt: keep.
      - name: food
        description: >-
          Food and meal photos, not kept by default: plates, dishes, drinks, restaurant and
          menu shots. Keep only when the dish is genuinely appetizing and well-shot, elaborate
          or special, or a clear special occasion such as a cake or a feast. People first: if
          posing people are the real subject and food is incidental, keep as a normal photo.
      - name: funny
        description: >-
          Memes and genuinely funny screenshots, including received ones.
  imaging:
    # A bare command name, resolved against PATH - not a machine-specific path. Override with a
    # full path via the standard env-var/user-config-file precedence if it isn't on PATH.
    heif-decoder-command: heif-convert
