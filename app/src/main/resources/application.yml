sluice:
  montage:
    tiles-per-row: 5
    tile-size: 224
  cull:
    # Which vision provider culls. Built in: external-agent (an agent you run reads the montages
    # and writes the decision shards) and anthropic (the app calls the Anthropic API with your
    # key). Future openai and ollama adapters are planned but not yet written. A new provider is
    # one class; see adapter/vision/package-info.java.
    provider: external-agent
    # Tuning for the external-agent provider only. mode: watch (default) polls the prep dir and
    # auto-resumes once every montage's shard has arrived; manual needs an explicit Resume once
    # shards are dropped. This is only the default a run starts with - a single waiting run's
    # auto-resume can be switched on or off on its own, whatever this says.
    external-agent:
      mode: watch
    # Category cards. name is the action id decisions carry. description is the "what belongs
    # here" prose an automated vision provider renders into its culling prompt. examples are
    # sample subjects rendered under it, and are optional - the cards below name their cases
    # inside the description itself, so none of them adds any. enabled: false leaves a card out
    # of a run entirely, and a card with no enabled key is on.
    categories:
      - name: scenery
        enabled: true
        description: >-
          Unremarkable scenery set aside for a second look, only when ALL of these hold: no
          posing people (random passers-by do not count), not a recognizable landmark, no
          striking light or sky, weak composition. Any doubt: keep.
      - name: food
        enabled: true
        description: >-
          Food and meal photos, not kept by default: plates, dishes, drinks, restaurant and
          menu shots. Keep only when the dish is genuinely appetizing and well-shot, elaborate
          or special, or a clear special occasion such as a cake or a feast. People first: if
          posing people are the real subject and food is incidental, keep as a normal photo.
      - name: funny
        enabled: true
        description: >-
          Memes and genuinely funny screenshots, including received ones.
  imaging:
    # A bare command name, resolved against PATH - not a machine-specific path. Override with a
    # full path via the standard env-var/user-config-file precedence if it isn't on PATH.
    heif-decoder-command: heif-convert
