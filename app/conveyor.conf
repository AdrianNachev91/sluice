// Packaging for Sluice. Two Maven goals have to run before this file will resolve:
//
//   mvn -f app/pom.xml package -DskipTests
//   mvn -f app/pom.xml dependency:copy-dependencies -DincludeScope=runtime \
//       -DoutputDirectory=target/lib -DexcludeGroupIds=org.openjfx
//
// The scope filter keeps the test libraries out of the installer. The group exclusion keeps the
// JavaFX jars out of it, because the modules come from the jmods below instead, and a jar and a
// jmod of the same module cannot both be on the path.

include required("jdk-26.0.2.1.conf")
include required("/stdlib/jvm/javafx/from-jmods.conf")

javafx.version = 26.0.1

app {
  display-name = Sluice
  fsname = sluice
  rdns-name = photos.sluice

  // Tracks the pom by hand. A dash starts a Linux package revision, which must itself begin with
  // a digit, so a Maven -SNAPSHOT qualifier cannot be passed straight through.
  version = 0.1.0

  // Where an installed copy looks for updates. Conveyor points the update feed at this
  // repository's latest release, and bakes that address into the packages. A build published
  // anywhere else offers its users no upgrade.
  vcs-url = "github.com/AdrianNachev91/sluice-package-rig"

  inputs += target/sluice-0.1.0-SNAPSHOT.jar
  inputs += target/lib

  jvm {
    gui.main-class = photos.sluice.SluiceApplication

    modules += javafx.controls

    // Granted here because nothing else grants it to a packaged build. The credential store binds
    // through the foreign-function API, and a later release blocks that call rather than warning.
    options += "--enable-native-access=ALL-UNNAMED"
  }
}

conveyor.compatibility-level = 22
