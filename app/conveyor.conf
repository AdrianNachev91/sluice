// Packaging for Sluice. Two Maven goals have to run before this file will resolve:
//
//   mvn -f app/pom.xml package -DskipTests
//   mvn -f app/pom.xml dependency:copy-dependencies -DincludeScope=runtime \
//       -DoutputDirectory=target/lib -DexcludeGroupIds=org.openjfx
//
// The group exclusion is the half that is not obvious: the JavaFX modules come from the jmods
// below, and a jar and a jmod of the same module cannot both be on the path.

include required("jdk-26.0.2.1.conf")
include required("/stdlib/jvm/javafx/from-jmods.conf")

// Must equal the pom's javafx.version property. A drift links jmods of one release into an image
// whose classes were compiled against another, and no build step fails on it.
// PackagingVersionsTest holds the two to one answer.
javafx.version = 26.0.2

// Which sluice-package-rig release the decoder archives below come from. Its own version rather
// than the pom's, since nothing here compiles against libheif. A bump needs no Java change for as
// long as the archive carries the heif-convert name, which is the only name the app looks for.
//
// The build number is a second key rather than a suffix on libheif.version: Conveyor caches a
// download against its URL, so a republish under the same tag is served the stale cached copy.
// Only the tag has to move for the cache to miss; the archive filenames stay on the bare version.
libheif.version = 1.23.4
libheif.build = 3

app {
  display-name = Sluice
  fsname = sluice
  rdns-name = photos.sluice

  // Must equal the pom's version. Update systems compare this string to decide whether a newer
  // build exists, and a drift makes the installer and the app name different versions of the same
  // files. PackagingVersionsTest holds the two to one answer.
  version = 1.0.0

  // Conveyor bakes this address into the packages as the update feed, pointing at the named
  // repository's latest release. A build published anywhere else offers its users no upgrade.
  vcs-url = "github.com/AdrianNachev91/sluice"

  // Repeats the pom's version. A mismatch fails the build on a missing input rather than quietly.
  inputs += target/sluice-1.0.0.jar
  inputs += target/lib

  // The HEIF decoder, one archive per machine, so nobody installs one by hand to read the photos
  // an iPhone takes. Built by sluice-package-rig because nothing published covers all five machines.
  //
  // Each archive carries heif-dec, the heif-convert name this app invokes, the five shared
  // libraries the tool loads, and their five licence texts. Decode only, so no encoder is inside a
  // package this signs.
  //
  // Unpacking lands them at heif/bin beside the app's own files, which is where the app looks.
  // BundledDecoderPathTest holds this destination and that lookup to the same answer, because a
  // disagreement fails no build and shows up only as photos that stop opening.
  windows.amd64.inputs   += { from = "https://github.com/AdrianNachev91/sluice-package-rig/releases/download/libheif-"${libheif.version}"-"${libheif.build}"/libheif-"${libheif.version}"-windows.amd64.zip",   to = heif }
  linux.amd64.inputs     += { from = "https://github.com/AdrianNachev91/sluice-package-rig/releases/download/libheif-"${libheif.version}"-"${libheif.build}"/libheif-"${libheif.version}"-linux.amd64.tar.gz",   to = heif }
  linux.aarch64.inputs   += { from = "https://github.com/AdrianNachev91/sluice-package-rig/releases/download/libheif-"${libheif.version}"-"${libheif.build}"/libheif-"${libheif.version}"-linux.aarch64.tar.gz", to = heif }
  mac.amd64.inputs       += { from = "https://github.com/AdrianNachev91/sluice-package-rig/releases/download/libheif-"${libheif.version}"-"${libheif.build}"/libheif-"${libheif.version}"-mac.amd64.tar.gz",     to = heif }
  mac.aarch64.inputs     += { from = "https://github.com/AdrianNachev91/sluice-package-rig/releases/download/libheif-"${libheif.version}"-"${libheif.build}"/libheif-"${libheif.version}"-mac.aarch64.tar.gz",   to = heif }

  jvm {
    // Two executables, because one cannot be both. Windows declares in the file header whether a
    // program is a console or a windowed one, and Conveyor picks console for a CLI launcher and
    // windowed for the GUI one. A single executable would either print nothing in a terminal or
    // flash a console window at somebody who clicked an icon.
    //
    // They also cannot share a name, in any casing: Conveyor refuses with "Two or more launchers
    // have conflicting names". The command keeps `sluice`, which is the name its own help prints
    // and every document uses.
    gui {
      main-class = photos.sluice.SluiceDesktop
      exe-name = SluiceDesktop
    }

    // A launcher's key is its executable name. An `exe-name` here is accepted and ignored.
    cli.sluice.main-class = photos.sluice.SluiceApplication

    modules += javafx.controls

    // Native access has to be granted per module, and this image has two kinds. A later release
    // blocks the call rather than warning, so both grants are load-bearing rather than cosmetic.
    //
    // The application's own jars, the credential store's among them, are copied onto the classpath
    // and are therefore unnamed. The credential store binds the three OS keyrings through the
    // foreign-function API.
    options += "--enable-native-access=ALL-UNNAMED"

    // JavaFX arrives as jmods and is linked into the image as a real module, so ALL-UNNAMED does
    // not reach it. It loads its own native libraries at startup, which is why the window's
    // launcher needs this and the command's does not.
    options += "--enable-native-access=javafx.graphics"
  }

  // The menu item has to name the window's launcher. Left alone it names the command, so clicking
  // Sluice runs a program that prints its help into a terminal the entry has already declared it
  // does not want, and no window opens.
  //
  // Every part of the path is Conveyor's own, so a change to the install prefix or to the
  // launcher's name moves this with it and there is nothing here to keep in step by hand.
  linux.desktop-file."Desktop Entry".Exec = ${app.linux.install-path}/bin/${app.jvm.gui.exe-name}
}

conveyor.compatibility-level = 22
