// The bundled runtime, pinned to an exact OpenJDK build.
//
// Conveyor resolves the jlink it links with from the Foojay API at build time, asking for the
// newest build available in this version line. jlink refuses to link when its own build string
// differs from the target java.base at all. So the runtime named here has to be the build Foojay
// currently answers with, and Conveyor's own bundled snippets stop short of it.
//
// Raising this means asking Foojay for the newest oracle_open_jdk in the line, then taking the
// hash and build number out of one package's download URL. The five files share both.

app.jvm.feature-version = 26
app.jvm.version = "26.0.2.1+1"

app.jvm {
  linux.aarch64.glibc.inputs += "https://download.java.net/java/GA/jdk26.0.2.1/3b8e6c7ec6274148a7aa15e7e7dfb53c/1/GPL/openjdk-26.0.2.1_linux-aarch64_bin.tar.gz"
  linux.amd64.glibc.inputs += "https://download.java.net/java/GA/jdk26.0.2.1/3b8e6c7ec6274148a7aa15e7e7dfb53c/1/GPL/openjdk-26.0.2.1_linux-x64_bin.tar.gz"
  mac.aarch64.inputs += "https://download.java.net/java/GA/jdk26.0.2.1/3b8e6c7ec6274148a7aa15e7e7dfb53c/1/GPL/openjdk-26.0.2.1_macos-aarch64_bin.tar.gz"
  mac.amd64.inputs += "https://download.java.net/java/GA/jdk26.0.2.1/3b8e6c7ec6274148a7aa15e7e7dfb53c/1/GPL/openjdk-26.0.2.1_macos-x64_bin.tar.gz"
  windows.amd64.inputs += "https://download.java.net/java/GA/jdk26.0.2.1/3b8e6c7ec6274148a7aa15e7e7dfb53c/1/GPL/openjdk-26.0.2.1_windows-x64_bin.zip"
}
